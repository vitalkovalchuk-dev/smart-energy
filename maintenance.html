<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Технічне обслуговування</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
     <h2>Технічне обслуговування</h2>

    <form id="maintenanceForm">
      <h3>Замір тиску газу по кожній задіяній лінії:</h3>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line1_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line1_filter_in_pressure" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line1_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line1_out" disabled> мм.вод.ст</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line2_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line2_filter_in_pressure" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line2_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line2_out" disabled> мм.вод.ст</label>
      </fieldset>

      <h3>Під час ТО виконано:</h3>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_check_valves"> перевірка запірної арматури та запобіжних клапанів</label><br>
        <label><input type="checkbox" id="line1_grease"> змащення тертьових частин</label><br>
        <label><input type="checkbox" id="line1_packing"> набивка сальників засувок</label><br>
        <label><input type="checkbox" id="line1_check_regulator"> перевірка регулятора тиску</label><br>
        <label><input type="checkbox" id="line1_membrane"> визначення чутливості мембран</label><br>
        <label><input type="checkbox" id="line1_check_zzk_zsk"> перевірка ЗСК, ЗЗК</label><br>
        <label><input type="checkbox" id="line1_clean_filter"> очищення фільтра</label><br>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_check_valves"> перевірка запірної арматури та запобіжних клапанів</label><br>
        <label><input type="checkbox" id="line2_grease"> змащення тертьових частин</label><br>
        <label><input type="checkbox" id="line2_packing"> набивка сальників засувок</label><br>
        <label><input type="checkbox" id="line2_check_regulator"> перевірка регулятора тиску</label><br>
        <label><input type="checkbox" id="line2_membrane"> визначення чутливості мембран</label><br>
        <label><input type="checkbox" id="line2_check_zzk_zsk"> перевірка ЗСК, ЗЗК</label><br>
        <label><input type="checkbox" id="line2_clean_filter"> очищення фільтра</label><br>
      </fieldset>

      <h4>Усунуто витоків газу</h4>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line1_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line1_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line1_leak1" disabled> шт</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line2_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line2_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line2_leak1" disabled> шт</label>
      </fieldset>

      <button type="button" id="sendDataBtn">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Чекбокси керують числовими полями
      const toggleFields = (checkboxId, fieldset) => {
        const cb = document.getElementById(checkboxId);
        cb.addEventListener("change", () => {
          fieldset.querySelectorAll("input[type=number]").forEach(inp => inp.disabled = !cb.checked);
        });
        cb.dispatchEvent(new Event("change"));
      };

      toggleFields("line1_status", document.querySelector("fieldset[legend='Лінія 1']"));
      toggleFields("line2_status", document.querySelector("fieldset[legend='Лінія 2']"));
      toggleFields("line1_leak_status", document.querySelectorAll("fieldset")[6]);
      toggleFields("line2_leak_status", document.querySelectorAll("fieldset")[7]);

      // Збереження даних у TO.json локально
      document.getElementById("sendDataBtn").addEventListener("click", () => {
        const data = {
          time: new Date().toISOString(),
          line1_status: document.getElementById("line1_status").checked,
          line2_status: document.getElementById("line2_status").checked,
          // додатково можна додати інші поля
        };

        const fileName = "TO.json";
        let existingData = [];
        const saved = localStorage.getItem(fileName);
        if (saved) {
          try { existingData = JSON.parse(saved); } catch { existingData = []; }
        }
        existingData.push(data);
        localStorage.setItem(fileName, JSON.stringify(existingData));

        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(existingData, null, 2)], {type: "application/json"}));
        a.download = fileName;
        a.click();

        alert("Дані передано та збережено у " + fileName);
      });
    });
  </script>
</body>
</html>
