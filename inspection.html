<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Технічний огляд</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
   <h2>Технічний огляд обладнання</h2>

    <form id="inspectionForm">
      <p>Замір тиску газу по кожній задіяній лінії:</p>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line1_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line1_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line1_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line1_out" disabled> мм.вод.ст</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line2_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line2_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line2_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line2_out" disabled> мм.вод.ст</label>
      </fieldset>

      <h4>Усунуто витоків газу</h4>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line1_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line1_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line1_leak1" disabled> шт</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line2_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line2_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line2_leak1" disabled> шт</label>
      </fieldset>

      <button type="button" id="sendDataBtn">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Логіка увімкнення/вимкнення числових полів
      const checkboxFields = [
        {checkbox: "line1_status", numbers: ["line1_in","line1_filter_in","line1_filter_out","line1_out"]},
        {checkbox: "line2_status", numbers: ["line2_in","line2_filter_in","line2_filter_out","line2_out"]},
        {checkbox: "line1_leak_status", numbers: ["line1_leak1","line1_leak2","line1_leak3"]},
        {checkbox: "line2_leak_status", numbers: ["line2_leak1","line2_leak2","line2_leak3"]}
      ];

      checkboxFields.forEach(group => {
        const cb = document.getElementById(group.checkbox);
        cb.addEventListener("change", () => {
          group.numbers.forEach(id => document.getElementById(id).disabled = !cb.checked);
        });
        cb.dispatchEvent(new Event("change"));
      });

      // Збереження у PO.json
      const btn = document.getElementById("sendDataBtn");
      btn.addEventListener("click", () => {
        const data = {
          time: new Date().toISOString(),
          line1_status: document.getElementById("line1_status").checked,
          line2_status: document.getElementById("line2_status").checked,
          line1_leak_status: document.getElementById("line1_leak_status").checked,
          line2_leak_status: document.getElementById("line2_leak_status").checked,
          line1_in: parseFloat(document.getElementById("line1_in").value) || 0,
          line1_filter_in: parseFloat(document.getElementById("line1_filter_in").value) || 0,
          line1_filter_out: parseFloat(document.getElementById("line1_filter_out").value) || 0,
          line1_out: parseFloat(document.getElementById("line1_out").value) || 0,
          line2_in: parseFloat(document.getElementById("line2_in").value) || 0,
          line2_filter_in: parseFloat(document.getElementById("line2_filter_in").value) || 0,
          line2_filter_out: parseFloat(document.getElementById("line2_filter_out").value) || 0,
          line2_out: parseFloat(document.getElementById("line2_out").value) || 0,
          line1_leak1: parseInt(document.getElementById("line1_leak1").value) || 0,
          line1_leak2: parseInt(document.getElementById("line1_leak2").value) || 0,
          line1_leak3: parseInt(document.getElementById("line1_leak3").value) || 0,
          line2_leak1: parseInt(document.getElementById("line2_leak1").value) || 0,
          line2_leak2: parseInt(document.getElementById("line2_leak2").value) || 0,
          line2_leak3: parseInt(document.getElementById("line2_leak3").value) || 0
        };

        const fileName = "PO.json";

        let existingData = [];
        const saved = localStorage.getItem(fileName);
        if (saved) {
          try {
            existingData = JSON.parse(saved);
          } catch(e) { existingData = []; }
        }

        existingData.push(data);
        localStorage.setItem(fileName, JSON.stringify(existingData));

        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(existingData,null,2)], {type:"application/json"}));
        a.download = fileName;
        a.click();

        alert("Дані передано та збережено у " + fileName);
      });
    });
  </script>
</body>
</html>
