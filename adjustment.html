<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регулювання</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
    <h2>Регулювання обладнання</h2>
    <h3>Технічний огляд обладнання</h3>

    <form id="inspectionForm">
      <fieldset>
        <legend>Лінія 1</legend>
        <label>
          <input type="checkbox" id="line1_status_adj"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Замір тиску газу на вході:
          <input type="number" step="0.01" id="line1_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на вході у фільтр:
          <input type="number" step="0.01" id="line1_filter_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході з фільтра:
          <input type="number" step="0.01" id="line1_filter_out" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході:
          <input type="number" step="1" id="line1_out" disabled> мм.вод.ст
        </label><br><br>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label>
          <input type="checkbox" id="line2_status_adj"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Замір тиску газу на вході:
          <input type="number" step="0.01" id="line2_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на вході у фільтр:
          <input type="number" step="0.01" id="line2_filter_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході з фільтра:
          <input type="number" step="0.01" id="line2_filter_out" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході:
          <input type="number" step="1" id="line2_out" disabled> мм.вод.ст
        </label>
      </fieldset>

      <h3>Регулювання обладнання (з режимної карти)</h3>
      <fieldset>
        <legend>Лінія 1</legend>
        <label>
          <input type="checkbox" id="line1_status_reg"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Встановлено тиск газу на виході регулятора:
          <input type="number" step="1" id="line1_out_reg" disabled> мм.вод.ст
        </label><br><br>
        
       <label>Встановлено тиск газу на ЗЗК:
          <input type="number" step="1" id="line1_out_zzk" disabled> мм.вод.ст
        </label><br><br>

       <label>Встановлено тиск газу на ЗСК:
          <input type="number" step="1" id="line1_out_zsk" disabled> мм.вод.ст
        </label><br><br>
       </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label>
          <input type="checkbox" id="line2_status_reg"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Встановлено тиск газу на виході регулятора:
          <input type="number" step="1" id="line2_out_reg" disabled> мм.вод.ст
        </label><br><br>

       <label>Встановлено тиск газу на ЗЗК:
          <input type="number" step="1" id="line2_out_zzk" disabled> мм.вод.ст
        </label><br><br>

       <label>Встановлено тиск газу на ЗСК:
          <input type="number" step="1" id="line2_out_zsk" disabled> мм.вод.ст
        </label><br><br>
      </fieldset>

      <h4>Усунуто витоків газу</h4>
      <fieldset>
        <legend>на лінії 1</legend>
        <label>
          <input type="checkbox" id="line1_status_leak"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>на газопроводі високого тиску:
          <input type="number" step="1" id="line1_leak3" disabled> шт
        </label><br><br>

        <label>на газопроводі середнього тиску:
          <input type="number" step="1" id="line1_leak2" disabled> шт
        </label>

        <label>на газопроводі низького тиску:
          <input type="number" step="1" id="line1_leak1" disabled> шт
        </label>
      </fieldset>

      <fieldset>
        <legend>на лінії 2</legend>
        <label>
          <input type="checkbox" id="line2_status_leak"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>на газопроводі високого тиску:
          <input type="number" step="1" id="line2_leak3" disabled> шт
        </label><br><br>

        <label>на газопроводі середнього тиску:
          <input type="number" step="1" id="line2_leak2" disabled> шт
        </label>

        <label>на газопроводі низького тиску:
          <input type="number" step="1" id="line2_leak1" disabled> шт
        </label>
      </fieldset>

      <button type="submit">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Керування активністю полів
      document.querySelectorAll("input[type=checkbox][id*='_status']").forEach(checkbox => {
        checkbox.addEventListener("change", () => {
          const fieldset = checkbox.closest("fieldset");
          if (!fieldset) return;
          const inputs = fieldset.querySelectorAll("input[type=number]");
          inputs.forEach(inp => inp.disabled = !checkbox.checked);
        });
        checkbox.dispatchEvent(new Event("change")); // виставляємо стан при завантаженні
      });

      // Відправка даних
      const form = document.getElementById("inspectionForm");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const data = {};
          form.querySelectorAll("input").forEach(inp => {
            if (inp.type === "checkbox") {
              data[inp.id] = inp.checked;
            } else {
              data[inp.id] = inp.value;
            }
          });

          try {
            const res = await fetch("/save", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                file: "ADJ.json",
                time: new Date().toISOString(),
                data
              })
            });

            const result = await res.json();
            if (result.success) {
              alert("Дані успішно надіслані!");
              form.reset();
              // після reset — викликаємо знову подію, щоб inputs стали disabled
              document.querySelectorAll("input[type=checkbox][id*='_status']").forEach(cb => {
                cb.dispatchEvent(new Event("change"));
              });
            } else {
              alert("Помилка: " + result.error);
            }
          } catch (err) {
            alert("Не вдалося надіслати дані!");
            console.error(err);
          }
        });
      }
    });
  </script>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form"); // або конкретна форма
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // 1. Визначаємо тип сторінки (для server.js)
    let page = "";
    if (location.pathname.includes("inspection")) page = "inspection";
    else if (location.pathname.includes("maintenance")) page = "maintenance";
    else if (location.pathname.includes("repair")) page = "repair";
    else if (location.pathname.includes("adjustment")) page = "adjustment";
    else if (location.pathname.includes("vk")) page = "vk";

    // 2. Збираємо дані з усіх input/checkbox
    const inputs = form.querySelectorAll("input, select, textarea");
    const data = {};
    inputs.forEach(el => {
      if (el.type === "checkbox") {
        data[el.id] = el.checked;
      } else {
        data[el.id] = el.value;
      }
    });

    // 3. Формуємо пакет
    const payload = {
      page,
      time: new Date().toISOString(),
      data
    };

    // 4. Відправка на сервер
    try {
      const res = await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (result.success) {
        alert("✅ Дані збережено!");
        form.reset(); // Очистити форму
      } else {
        alert("❌ Помилка: " + result.error);
      }
    } catch (err) {
      alert("⚠ Сервер недоступний");
      console.error(err);
    }
  });
});
</script>

  
</body>
</html>
