<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регулювання</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
    <h2>Регулювання обладнання</h2>
    <h3>Технічний огляд обладнання</h3>

    <form id="adjustmentForm">
      <!-- ====== Лінія 1 ====== -->
      <fieldset>
        <legend>Лінія 1</legend>
        <label>
          <input type="checkbox" id="line1_status_adj"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Замір тиску газу на вході:
          <input type="number" step="0.01" id="line1_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на вході у фільтр:
          <input type="number" step="0.01" id="line1_filter_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході з фільтра:
          <input type="number" step="0.01" id="line1_filter_out" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході:
          <input type="number" step="1" id="line1_out" disabled> мм.вод.ст
        </label><br><br>
      </fieldset>

      <!-- ====== Лінія 2 ====== -->
      <fieldset>
        <legend>Лінія 2</legend>
        <label>
          <input type="checkbox" id="line2_status_adj"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Замір тиску газу на вході:
          <input type="number" step="0.01" id="line2_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на вході у фільтр:
          <input type="number" step="0.01" id="line2_filter_in" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході з фільтра:
          <input type="number" step="0.01" id="line2_filter_out" disabled> МПа
        </label><br><br>

        <label>Замір тиску газу на виході:
          <input type="number" step="1" id="line2_out" disabled> мм.вод.ст
        </label>
      </fieldset>

      <!-- ====== Регулювання (режимна карта) ====== -->
      <h3>Регулювання обладнання (з режимної карти)</h3>

      <fieldset>
        <legend>Лінія 1</legend>
        <label>
          <input type="checkbox" id="line1_status_reg"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Встановлено тиск газу на виході регулятора:
          <input type="number" step="1" id="line1_out_reg" disabled> мм.вод.ст
        </label><br><br>

        <label>Встановлено тиск газу на ЗЗК:
          <input type="number" step="1" id="line1_out_zzk" disabled> мм.вод.ст
        </label><br><br>

        <label>Встановлено тиск газу на ЗСК:
          <input type="number" step="1" id="line1_out_zsk" disabled> мм.вод.ст
        </label><br><br>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label>
          <input type="checkbox" id="line2_status_reg"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>Встановлено тиск газу на виході регулятора:
          <input type="number" step="1" id="line2_out_reg" disabled> мм.вод.ст
        </label><br><br>

        <label>Встановлено тиск газу на ЗЗК:
          <input type="number" step="1" id="line2_out_zzk" disabled> мм.вод.ст
        </label><br><br>

        <label>Встановлено тиск газу на ЗСК:
          <input type="number" step="1" id="line2_out_zsk" disabled> мм.вод.ст
        </label><br><br>
      </fieldset>

      <!-- ====== Усунено витоків газу ====== -->
      <h4>Усунуто витоків газу</h4>

      <fieldset>
        <legend>на лінії 1</legend>
        <label>
          <input type="checkbox" id="line1_status_leak"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>на газопроводі високого тиску:
          <input type="number" step="1" id="line1_leak3" disabled> шт
        </label><br><br>

        <label>на газопроводі середнього тиску:
          <input type="number" step="1" id="line1_leak2" disabled> шт
        </label><br><br>

        <label>на газопроводі низького тиску:
          <input type="number" step="1" id="line1_leak1" disabled> шт
        </label>
      </fieldset>

      <fieldset>
        <legend>на лінії 2</legend>
        <label>
          <input type="checkbox" id="line2_status_leak"> ВКЛ/ВИКЛ
        </label><br><br>

        <label>на газопроводі високого тиску:
          <input type="number" step="1" id="line2_leak3" disabled> шт
        </label><br><br>

        <label>на газопроводі середнього тиску:
          <input type="number" step="1" id="line2_leak2" disabled> шт
        </label><br><br>

        <label>на газопроводі низького тиску:
          <input type="number" step="1" id="line2_leak1" disabled> шт
        </label>
      </fieldset>

      <button type="submit">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ====== Керування чекбоксами ======
      document.querySelectorAll("input[type=checkbox][id*='status']").forEach(checkbox => {
        checkbox.addEventListener("change", () => {
          const fieldset = checkbox.closest("fieldset");
          if (!fieldset) return;
          const inputs = fieldset.querySelectorAll("input[type=number]");
          inputs.forEach(inp => inp.disabled = !checkbox.checked);
        });
        checkbox.dispatchEvent(new Event("change"));
      });

      // ====== Універсальна відправка даних + журнал ======
      const form = document.getElementById("adjustmentForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {};
        const inputs = form.querySelectorAll("input");
        inputs.forEach(inp => {
          let labelText = inp.closest("label")?.textContent.trim() || inp.id;
          let unitMatch = labelText.match(/([^\d]+)$/);
          let unit = unitMatch ? unitMatch[1].trim() : "";
          data[inp.id] = {
            value: inp.type === "checkbox" ? inp.checked : inp.value,
            label: labelText,
            unit: unit
          };
        });

        const payload = {
          page: "adjustment",
          time: new Date().toISOString(),
          data
        };

        try {
          // ====== Збереження в ADJ.json ======
          await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file: "ADJ.json", ...payload })
          });

          // ====== Додатково в електронний журнал ======
          await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file: "journal.json", ...payload })
          });

          alert("✅ Дані успішно надіслані!");
          form.reset();
          // Поновлюємо стан полів після reset
          document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb => {
            cb.dispatchEvent(new Event("change"));
          });

        } catch (err) {
          alert("❌ Помилка відправки!");
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
