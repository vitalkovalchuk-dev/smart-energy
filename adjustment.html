<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регулювання обладнання</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
   <h2>Регулювання обладнання</h2>
    <h3>Замір тиску газу по кожній задіяній лінії</h3>

    <form id="adjustmentForm">
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status_adj"> ВКЛ/ВИКЛ</label><br><br>
        <label>Тиск газу на вході: <input type="number" step="0.01" id="line1_in" disabled> МПа</label><br><br>
        <label>Тиск на вході у фільтр: <input type="number" step="0.01" id="line1_filter_in" disabled> МПа</label><br><br>
        <label>Тиск на виході з фільтра: <input type="number" step="0.01" id="line1_filter_out" disabled> МПа</label><br><br>
        <label>Тиск на виході: <input type="number" step="1" id="line1_out" disabled> мм.вод.ст</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status_adj"> ВКЛ/ВИКЛ</label><br><br>
        <label>Тиск газу на вході: <input type="number" step="0.01" id="line2_in" disabled> МПа</label><br><br>
        <label>Тиск на вході у фільтр: <input type="number" step="0.01" id="line2_filter_in" disabled> МПа</label><br><br>
        <label>Тиск на виході з фільтра: <input type="number" step="0.01" id="line2_filter_out" disabled> МПа</label><br><br>
        <label>Тиск на виході: <input type="number" step="1" id="line2_out" disabled> мм.вод.ст</label>
      </fieldset>

      <h3>Регулювання обладнання (з режимної карти)</h3>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status_reg"> ВКЛ/ВИКЛ</label><br><br>
        <label>Тиск на виході регулятора: <input type="number" step="1" id="line1_out_reg" disabled> мм.вод.ст</label><br><br>
        <label>Тиск на ЗЗК: <input type="number" step="1" id="line1_out_zzk" disabled> мм.вод.ст</label><br><br>
        <label>Тиск на ЗСК: <input type="number" step="1" id="line1_out_zsk" disabled> мм.вод.ст</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status_reg"> ВКЛ/ВИКЛ</label><br><br>
        <label>Тиск на виході регулятора: <input type="number" step="1" id="line2_out_reg" disabled> мм.вод.ст</label><br><br>
        <label>Тиск на ЗЗК: <input type="number" step="1" id="line2_out_zzk" disabled> мм.вод.ст</label><br><br>
        <label>Тиск на ЗСК: <input type="number" step="1" id="line2_out_zsk" disabled> мм.вод.ст</label>
      </fieldset>

      <h4>Усунуто витоків газу</h4>
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status_leak"> ВКЛ/ВИКЛ</label><br><br>
        <label>Високого тиску: <input type="number" step="1" id="line1_leak3" disabled> шт</label><br>
        <label>Середнього тиску: <input type="number" step="1" id="line1_leak2" disabled> шт</label><br>
        <label>Низького тиску: <input type="number" step="1" id="line1_leak1" disabled> шт</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status_leak"> ВКЛ/ВИКЛ</label><br><br>
        <label>Високого тиску: <input type="number" step="1" id="line2_leak3" disabled> шт</label><br>
        <label>Середнього тиску: <input type="number" step="1" id="line2_leak2" disabled> шт</label><br>
        <label>Низького тиску: <input type="number" step="1" id="line2_leak1" disabled> шт</label>
      </fieldset>

      <button type="submit">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>
  
  <script>
    // Функція для створення/доповнення JSON-файлу локально
    function saveAdjustmentData() {
      const data = {
        time: new Date().toISOString(),
        param1: document.getElementById("param1").value,
        param2: document.getElementById("param2").value
      };

      const fileName = "ADJ.json";

      // Завантаження існуючих даних з LocalStorage (імітація файлу)
      let existingData = [];
      const saved = localStorage.getItem(fileName);
      if (saved) {
        try {
          existingData = JSON.parse(saved);
        } catch (e) {
          existingData = [];
        }
      }

      existingData.push(data);

      // Збереження "файлу" у LocalStorage
      localStorage.setItem(fileName, JSON.stringify(existingData));

      // Генерація завантажуваного JSON-файлу
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(existingData, null, 2)], {type: "application/json"}));
      a.download = fileName;
      a.click();

      alert("Дані передано та збережено у " + fileName);
    }

    document.getElementById("sendDataBtn").addEventListener("click", saveAdjustmentData);
  </script>
</body>
</html>
