<!DOCTYPE html>

    <link rel='stylesheet' href='css/style.css'>
    <style>
      ul li {
        margin: 10px 0;
      }
    .doc-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0056b3;
      font-size: 16px;
    }
    .doc-link:hover {
      text-decoration: underline;
    }
    .doc-icon {
      width: 40px;   /* розмір іконки */
      height: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("header.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
          });
      });
    </script>
  </head>
  <body>
    <h2>Робочий проект ПРГ</h2>
    <ul>
        <li>
          <a href="docs/proect_tom1_pz.pdf" class="doc-link" target="_blank">

          </a>
          <img src="img/proect_tom1_pz_page-0001.jpg" alt="Іконка проекту" class="doc-icon">
        </li>
                </li>
        <li>
          <a href="docs/proect_tom1_addon.pdf" class="doc-link" target="_blank">
            Робочий проект. Том 1 (Додатки)
          </a>

        </li>
    </ul>
    
    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

    <script>
      function goBackOneLevel() {
        let path = window.location.pathname.split("/");
        if (path.length > 2) {
          path.pop(); // прибираємо поточний файл
          window.location.href = path.join("/") + "/";
        } else {
          // якщо ми вже в корені сайту
          window.location.href = "/";
        }
      }
    </script>
  </body>
