<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плановий ремонт</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
</head>
<body>
  <div id="header"></div>
  <script>
    fetch("header.html").then(r=>r.text()).then(html=>document.getElementById("header").innerHTML=html);
  </script>

  <main>
    <h2>Плановий ремонт</h2>

    <form id="repairForm">
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line1_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line1_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line1_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line1_out" disabled> мм.вод.ст</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line2_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line2_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line2_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line2_out" disabled> мм.вод.ст</label>
      </fieldset>

      <h3>Виконані роботи:</h3>
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_clean_filter"> очищення фільтра</label><br>
        <label><input type="checkbox" id="line1_check_valves"> перевірка запірної арматури</label><br>
        <label><input type="checkbox" id="line1_grease"> змащення тертьових частин</label><br>
        <label><input type="checkbox" id="line1_check_regulator"> перевірка регулятора тиску</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_clean_filter"> очищення фільтра</label><br>
        <label><input type="checkbox" id="line2_check_valves"> перевірка запірної арматури</label><br>
        <label><input type="checkbox" id="line2_grease"> змащення тертьових частин</label><br>
        <label><input type="checkbox" id="line2_check_regulator"> перевірка регулятора тиску</label>
      </fieldset>

      <button type="submit">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", ()=>{
    document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const fs=cb.closest("fieldset");
        if(!fs) return;
        fs.querySelectorAll("input[type=number]").forEach(inp=>inp.disabled=!cb.checked);
      });
      cb.dispatchEvent(new Event("change"));
    });

    const form=document.getElementById("repairForm");
    form.addEventListener("submit", e=>{
      e.preventDefault();
      const data={};
      form.querySelectorAll("input").forEach(inp=>data[inp.id]=inp.type==="checkbox"?inp.checked:inp.value);

      const payload={page:"repair", time:new Date().toISOString(), data};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="REPAIR.json";
      a.click();
      URL.revokeObjectURL(url);
      alert("✅ Дані готові до завантаження!");
      form.reset();
      document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb=>cb.dispatchEvent(new Event("change")));
    });
  });
  </script>
</body>
</html>
