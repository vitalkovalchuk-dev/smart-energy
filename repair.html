<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Плановий ремонт</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
    <h2>Плановий ремонт</h2>

    <form id="repairForm">
      <h3>Замір тиску газу по кожній задіяній лінії:</h3>

      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line1_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line1_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line1_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line1_out" disabled> мм.вод.ст</label><br><br>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>На вході: <input type="number" step="0.01" id="line2_in" disabled> МПа</label><br><br>
        <label>На вході у фільтр: <input type="number" step="0.01" id="line2_filter_in" disabled> МПа</label><br><br>
        <label>На виході з фільтра: <input type="number" step="0.01" id="line2_filter_out" disabled> МПа</label><br><br>
        <label>На виході: <input type="number" step="1" id="line2_out" disabled> мм.вод.ст</label><br><br>
      </fieldset>

      <h3>Під час ремонту виконано:</h3>
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_clean_filter"> очищення фільтра</label><br>
        <label><input type="checkbox" id="line1_regulator"> заміна регулятора</label><br>
        <label><input type="checkbox" id="line1_zzk"> заміна ЗЗК</label><br>
        <label><input type="checkbox" id="line1_zsk"> заміна ЗСК</label><br>
        <label><input type="checkbox" id="line1_vp"> заміна відключаючих пристроїв</label><br>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_clean_filter"> очищення фільтра</label><br>
        <label><input type="checkbox" id="line2_regulator"> заміна регулятора</label><br>
        <label><input type="checkbox" id="line2_zzk"> заміна ЗЗК</label><br>
        <label><input type="checkbox" id="line2_zsk"> заміна ЗСК</label><br>
        <label><input type="checkbox" id="line2_vp"> заміна відключаючих пристроїв</label><br>
      </fieldset>

      <h4>Усунуто витоків газу</h4>
      <fieldset>
        <legend>Лінія 1</legend>
        <label><input type="checkbox" id="line1_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line1_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line1_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line1_leak1" disabled> шт</label>
      </fieldset>

      <fieldset>
        <legend>Лінія 2</legend>
        <label><input type="checkbox" id="line2_leak_status"> ВКЛ/ВИКЛ</label><br><br>
        <label>високого тиску: <input type="number" step="1" id="line2_leak3" disabled> шт</label><br><br>
        <label>середнього тиску: <input type="number" step="1" id="line2_leak2" disabled> шт</label><br><br>
        <label>низького тиску: <input type="number" step="1" id="line2_leak1" disabled> шт</label>
      </fieldset>

      <button type="button" id="sendDataBtn">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
    // Активуємо числові поля залежно від чекбоксів
    document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb => {
      cb.addEventListener("change", () => {
        const fs = cb.closest("fieldset");
        if (!fs) return;
        fs.querySelectorAll("input[type=number]").forEach(inp => inp.disabled = !cb.checked);
      });
      cb.dispatchEvent(new Event("change"));
    });

    // Функція збереження у PR.json локально
    function saveRepairData() {
      const data = {
        time: new Date().toISOString(),
        line1_status: document.getElementById("line1_status").checked,
        line2_status: document.getElementById("line2_status").checked,
        line1_in: document.getElementById("line1_in").value,
        line1_filter_in: document.getElementById("line1_filter_in").value,
        line1_filter_out: document.getElementById("line1_filter_out").value,
        line1_out: document.getElementById("line1_out").value,
        line2_in: document.getElementById("line2_in").value,
        line2_filter_in: document.getElementById("line2_filter_in").value,
        line2_filter_out: document.getElementById("line2_filter_out").value,
        line2_out: document.getElementById("line2_out").value,
        line1_clean_filter: document.getElementById("line1_clean_filter").checked,
        line1_regulator: document.getElementById("line1_regulator").checked,
        line1_zzk: document.getElementById("line1_zzk").checked,
        line1_zsk: document.getElementById("line1_zsk").checked,
        line1_vp: document.getElementById("line1_vp").checked,
        line2_clean_filter: document.getElementById("line2_clean_filter").checked,
        line2_regulator: document.getElementById("line2_regulator").checked,
        line2_zzk: document.getElementById("line2_zzk").checked,
        line2_zsk: document.getElementById("line2_zsk").checked,
        line2_vp: document.getElementById("line2_vp").checked,
        line1_leak_status: document.getElementById("line1_leak_status").checked,
        line1_leak3: document.getElementById("line1_leak3").value,
        line1_leak2: document.getElementById("line1_leak2").value,
        line1_leak1: document.getElementById("line1_leak1").value,
        line2_leak_status: document.getElementById("line2_leak_status").checked,
        line2_leak3: document.getElementById("line2_leak3").value,
        line2_leak2: document.getElementById("line2_leak2").value,
        line2_leak1: document.getElementById("line2_leak1").value
      };

      const fileName = "PR.json";

      let existingData = [];
      const saved = localStorage.getItem(fileName);
      if (saved) {
        try {
          existingData = JSON.parse(saved);
        } catch (e) {
          existingData = [];
        }
      }

      existingData.push(data);
      localStorage.setItem(fileName, JSON.stringify(existingData));

      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(existingData, null, 2)], {type: "application/json"}));
      a.download = fileName;
      a.click();

      alert("Дані передано та збережено у " + fileName);
    }

    document.getElementById("sendDataBtn").addEventListener("click", saveRepairData);
  </script>
</body>
</html>
