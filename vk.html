<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відомчий контроль</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
    <h1>Відомчий контроль</h1>

    <section class="remarks">
      <h2>Виявлені недоліки / зауваження</h2>
      <textarea id="remarksInput" rows="5" placeholder="Введіть зауваження..."></textarea>
      <br>
      <button onclick="saveRemark()">Зберегти</button>
    </section>

    <section class="journal-access">
  
      <p>Для перегляду та фільтрації подій скористайтесь журналом нижче:</p>
      <iframe src="journal.html" width="100%" height="500" style="border:1px solid #ccc; border-radius:8px;"></iframe>
    </section>
  </main>

  <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

  <script>
    async function saveRemark() {
      const text = document.getElementById("remarksInput").value.trim();
      if (!text) {
        alert("Введіть текст зауваження!");
        return;
      }

      const remark = {
        time: new Date().toISOString(),
        user: "currentUser", // тут підставиш авторизованого користувача
        role: "Kontrol",     // роль, яка залишає зауваження
        action: "remark",
        details: text,
        file: "VK.json"      // важливо! саме у цей файл буде збережено
      };

      try {
        const res = await fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(remark)
        });

        const result = await res.json();
        if (result.success) {
          alert("Зауваження збережено!");
          document.getElementById("remarksInput").value = "";
        } else {
          alert("Помилка: " + result.error);
        }
      } catch (err) {
        console.error("Помилка запиту:", err);
        alert("Не вдалося зберегти зауваження!");
      }
    }
  </script>
</body>
</html>
