<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відомчий контроль</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
  <main>
       <h1>Відомчий контроль</h1>

    <section class="remarks">
      <h2>Виявлені недоліки / зауваження</h2>
      <textarea id="remarksInput" rows="5" placeholder="Введіть зауваження..."></textarea>
      <br>
      <button onclick="saveRemark()">Зберегти</button>
    </section>

    <section class="journal-access">
      <h2>Електронний журнал</h2>
      <p>Для перегляду та фільтрації подій скористайтесь журналом нижче:</p>
      <iframe src="journal.html" width="100%" height="500" style="border:1px solid #ccc; border-radius:8px;"></iframe>
    </section>
  </main>

  <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Керування активністю числових полів через чекбокси
      document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb => {
        cb.addEventListener("change", () => {
          const fs = cb.closest("fieldset");
          if (!fs) return;
          fs.querySelectorAll("input[type=number]").forEach(inp => inp.disabled = !cb.checked);
        });
        cb.dispatchEvent(new Event("change"));
      });

      // Відправка даних у VK.json
      const form = document.getElementById("vkForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {};
        form.querySelectorAll("input").forEach(inp => {
          data[inp.id] = inp.type === "checkbox" ? inp.checked : inp.value;
        });

        try {
          const res = await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              file: "VK.json",
              time: new Date().toISOString(),
              data
            })
          });
          const result = await res.json();
          if (result.success) {
            alert("Дані успішно збережено!");
            form.reset();
            document.querySelectorAll("input[type=checkbox][id*='status']").forEach(cb => {
              cb.dispatchEvent(new Event("change"));
            });
          } else {
            alert("Помилка: " + result.error);
          }
        } catch (err) {
          alert("Не вдалося надіслати дані!");
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
