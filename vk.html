<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відомчий контроль</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
  <style>
    /* Адаптивне поле для коментаря */
    #remarksInput {
      width: 100%;
      max-width: 100%;
      min-height: 5em;       /* ~5 рядків тексту */
      max-height: 6em;       /* ~6 рядків тексту */
      resize: vertical;
      overflow-y: auto;
      padding: 0.5em;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .remarks button {
      margin-top: 0.5em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Відомчий контроль</h1>

    <section class="remarks">
      <h2>Виявлені недоліки / зауваження</h2>
      <textarea id="remarksInput" placeholder="Введіть зауваження..."></textarea>
      <br>
      <button onclick="saveRemark()">Зберегти</button>
    </section>

    <section class="journal-access">
      <p>Для перегляду та фільтрації подій скористайтесь журналом нижче:</p>
      <iframe src="journal.html" width="100%" height="500" style="border:1px solid #ccc; border-radius:8px;"></iframe>
    </section>
  </main>

  <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

  <script>
    // Локальне збереження коментаря в VK.json
    function saveRemark() {
      const text = document.getElementById("remarksInput").value.trim();
      if (!text) {
        alert("Введіть текст зауваження!");
        return;
      }

      const remark = {
        time: new Date().toISOString(),
        user: "currentUser", // тут підставиш авторизованого користувача
        role: "Kontrol",     // роль, яка залишає зауваження
        action: "remark",
        details: text
      };

      // Генерація файлу VK.json локально
      const blob = new Blob([JSON.stringify(remark, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "VK.json";
      a.click();
      URL.revokeObjectURL(a.href);

      // Очищення textarea
      document.getElementById("remarksInput").value = "";
      alert("Зауваження збережено локально у VK.json");
    }
  </script>
</body>
</html>
