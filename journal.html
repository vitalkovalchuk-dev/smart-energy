<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Електронний журнал</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/js_script.js" defer></script>
</head>
<body>
  <main>
    <h2>Електронний журнал</h2>

    <form id="journalForm">
      <fieldset>
        <legend>Фільтрувати записи</legend>

        <label>Тип процедури:
          <select id="journal_type">
            <option value="PO">Технічний огляд</option>
            <option value="TO">Технічне обслуговування</option>
            <option value="PR">Плановий ремонт</option>
            <option value="ADJ">Регулювання</option>
            <option value="VK">Відомчий контроль</option>
          </select>
        </label>
      </fieldset>

      <button type="submit">Передати дані</button>
    </form>

    <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Активність полів через чекбокс
      const activeCheckbox = document.getElementById("journal_active");
      const inputs = document.querySelectorAll("#journalForm input[type=text]");
      activeCheckbox.addEventListener("change", () => {
        inputs.forEach(inp => inp.disabled = !activeCheckbox.checked);
      });
      activeCheckbox.dispatchEvent(new Event("change"));

      // Відправка даних у JOURNAL.json
      const form = document.getElementById("journalForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {};
        form.querySelectorAll("input, select").forEach(inp => {
          data[inp.id] = inp.type === "checkbox" ? inp.checked : inp.value;
        });

        try {
          const res = await fetch("/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              file: "JOURNAL.json",
              time: new Date().toISOString(),
              data
            })
          });
          const result = await res.json();
          if (result.success) {
            alert("Дані успішно збережено!");
            form.reset();
            activeCheckbox.dispatchEvent(new Event("change"));
          } else {
            alert("Помилка: " + result.error);
          }
        } catch (err) {
          alert("Не вдалося надіслати дані!");
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
