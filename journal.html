<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Електронний журнал</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
    th { background-color: #eee; }
    select { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>Електронний журнал</h2>

  <label>Фільтр по типу процедури: </label>
  <select id="typeFilter">
    <option value="">Усі</option>
    <option value="INS">Технічний огляд</option>
    <option value="ADJ">Регулювання обладнання</option>
    <option value="TO">Tехнічне обслуговування</option>
    <option value="VK">Відомчий контроль</option>
    <option value="REM">Поточний ремонт/option>
  </select>

  <table id="journalTable">
    <thead>
      <tr>
        <th>Час</th>
        <th>Користувач</th>
        <th>Геолокація</th>
        <th>Тип процедури</th>
        <th>Дані</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
<button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>
  
  <script>
    // словник для зрозумілих назв
    const fieldNames = {
      // поля ліній
      line1_status_ins: "Лінія 1 ВКЛ/ВИКЛ",
      line2_status_ins: "Лінія 2 ВКЛ/ВИКЛ",
      line1_pressure_in: "Тиск на вході лінії 1, МПа",
      line1_pressure_out: "Тиск на виході лінії 1, мм.вод.ст",
      line2_pressure_in: "Тиск на вході лінії 2, МПа",
      line2_pressure_out: "Тиск на виході лінії 2, мм.вод.ст",
      line1_status_adj: "Лінія 1 ВКЛ/ВИКЛ",
      line2_status_adj: "Лінія 2 ВКЛ/ВИКЛ",
      line1_in: "Тиск на вході лінії 1, МПа",
      line1_filter_in: "Тиск на вході у фільтр, МПа",
      line1_filter_out: "Тиск на виході з фільтра, МПа",
      line1_out: "Тиск на виході, мм.вод.ст",
      line1_out_reg: "Тиск на виході регулятора, мм.вод.ст",
      line1_out_zzk: "Тиск на ЗЗК, мм.вод.ст",
      line1_out_zsk: "Тиск на ЗСК, мм.вод.ст",
      line1_leak1: "Витоки низького тиску, шт",
      line1_leak2: "Витоки середнього тиску, шт",
      line1_leak3: "Витоки високого тиску, шт",
      line1_status_to: "Лінія 1 активна",
      line1_filter_cleaned: "Фільтр лінії 1 очищено",
      line1_valve_checked: "Кран лінії 1 перевірено",
      line2_status_to: "Лінія 2 активна",

      // переклад типів процедур
      INS: "Технічний огляд",
      ADJ: "Регулювання обладнання",
      TO:  "Технічне обслуговування",
      VK:  "Відомчий контроль",
      REM: "Поточний ремонт"
    };

    // дані журналу (можна підвантажити з journal.json)
    const journalData = [
      {"time":"2025-01-13T09:10:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.95,"line1_pressure_out":218,"line2_status_ins":false},
      {"time":"2025-02-12T07:25:00Z","user":"Павліщук Б.Є.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.91,"line1_pressure_out":222,"line2_status_ins":true,"line2_pressure_in":0.93,"line2_pressure_out":221},
      {"time":"2025-03-14T07:45:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.88,"line1_pressure_out":215},
      {"time":"2025-04-08T12:10:00Z","user":"Мельник І.Ю.","geo":"49.528523, 28.486152","type":"VK","action":"Перевірив заповнення журналів, наявність графіків, інструкцій - документація наявна, записи ведуться вчасно. Виявлено витік на фланцевому з’єднанні крана лінії 1 на низькому тиску"},
      {"time":"2025-04-14T11:30:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.9,"line1_pressure_out":217,"line2_status_ins":true,"line2_pressure_in":0.91,"line2_pressure_out":216},
      {"time":"2025-04-14T13:30:00Z","user":"Волинець Ю.І.","geo":"49.528523, 28.486152","type":"ADJ","line1_status_adj":true,"line2_status_adj":false,"line1_in":0.92,"line1_filter_in":0.91,"line1_filter_out":0.89,"line1_out":220,"line1_out_reg":220,"line1_out_zzk":250,"line1_out_zsk":229,"line1_leak1":2,"line1_leak2":3,"line1_leak3":0},
      {"time":"2025-05-01T11:05:00Z","user":"Пендюр О.М.","geo":"49.528523, 28.486152","type":"VK","action":"Перевірив якість регулювання ПРГ. Тиск газу на лінії 1 відповідає режимній карті. Виявлено витік на триходовому крані на вході по лінії 1"},
      {"time":"2025-05-14T09:07:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":false,"line2_status_ins":true,"line2_pressure_in":0.92,"line2_pressure_out":219},
      {"time":"2025-06-13T10:10:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.89,"line1_pressure_out":214},
      {"time":"2025-07-11T10:00:00Z","user":"Василига А.М.","geo":"49.528523, 28.486152","type":"INS","line1_status_ins":true,"line1_pressure_in":0.87,"line1_pressure_out":213},
      {"time":"2025-07-11T08:00:00Z","user":"Волинець Ю.І.","geo":"49.528533, 28.486158","type":"INS","line1_status_ins":true,"line1_pressure_in":0.9,"line1_pressure_out":217,"line2_status_ins":true,"line2_pressure_in":0.91,"line2_pressure_out":216},
      {"time":"2025-07-15T09:00:00Z","user":"Волинець Ю.І.","geo":"49.528523, 28.486152","type":"TO","line1_status_to":true,"line1_filter_cleaned":true,"line1_valve_checked":true,"line2_status_to":false},
      {"time":"2025-07-17T08:15:00Z","user":"Пендюр О.М.","geo":"49.528530, 28.486148","type":"VK","action":"Перевірив якість технічного обслуговування ПРГ. Витоків не виявлено, документація наявна, записи ведуться вчасно"},
      {"time":"2025-08-11T09:20:00Z","user":"Василига А.М.","geo":"49.528528, 28.486167","type":"INS","line1_status_ins":true,"line1_pressure_in":0.92,"line1_pressure_out":218}
    ];

    const tbody = document.querySelector("#journalTable tbody");
    const typeFilter = document.getElementById("typeFilter");

    function renderTable(filterType) {
      tbody.innerHTML = "";

      journalData.forEach(entry => {
        if (filterType && entry.type !== filterType) return;

        const tr = document.createElement("tr");

        // час
        const timeTd = document.createElement("td");
        timeTd.textContent = new Date(entry.time).toLocaleString();
        tr.appendChild(timeTd);

        // користувач
        const userTd = document.createElement("td");
        userTd.textContent = entry.user;
        tr.appendChild(userTd);

        // геолокація
        const geoTd = document.createElement("td");
        geoTd.textContent = entry.geo;
        tr.appendChild(geoTd);

        // тип процедури
        const typeTd = document.createElement("td");
        typeTd.textContent = fieldNames[entry.type] || entry.type;
        tr.appendChild(typeTd);

        // дані
        const dataTd = document.createElement("td");
        let dataStr = "";
        if (entry.type === "VK") {
          dataStr = entry.action || "";
        } else {
          for (const key in entry) {
            if (!["time","user","geo","type","action"].includes(key)) {
              if (fieldNames[key]) {
                dataStr += `${fieldNames[key]}: ${entry[key]}; `;
              }
            }
          }
        }
        dataTd.textContent = dataStr;
        tr.appendChild(dataTd);

        tbody.appendChild(tr);
      });
    }

    typeFilter.addEventListener("change", () => {
      renderTable(typeFilter.value);
    });

    renderTable(""); // початковий рендер всіх записів
  </script>
</body>
</html>
