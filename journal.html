<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Електронний журнал</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; cursor: pointer; }
    pre { margin: 0; font-family: monospace; }
    .filters { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Електронний журнал</h1>

  <div class="filters">
    <label>Сторінка:
      <select id="pageFilter">
        <option value="all">Всі</option>
        <option value="inspection">Технічний огляд</option>
        <option value="maintenance">Технічне обслуговування</option>
        <option value="repair">Плановий ремонт</option>
        <option value="adjustment">Регулювання</option>
        <option value="vk">Відомчий контроль</option>
      </select>
    </label>

    <label>Дата від:
      <input type="date" id="dateFrom">
    </label>
    <label>до:
      <input type="date" id="dateTo">
    </label>
    <button onclick="applyFilters()">Фільтрувати</button>
    <button onclick="resetFilters()">Скинути</button>
  </div>

  <table id="logTable">
    <thead>
      <tr>
        <th>Час</th>
        <th>Сторінка</th>
        <th>Дані</th>
      </tr>
    </thead>
    <tbody id="logBody">
      <!-- записи будуть вставлені сервером -->

      <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

    </tbody>
  </table>

  <script>
    const logTable = document.getElementById("logTable");
    const logBody = document.getElementById("logBody");

    function applyFilters() {
      const pageValue = document.getElementById("pageFilter").value;
      const dateFrom = document.getElementById("dateFrom").value;
      const dateTo = document.getElementById("dateTo").value;

      for (const row of logBody.rows) {
        const rowPage = row.cells[1].textContent;
        const rowTime = new Date(row.cells[0].textContent);

        let visible = true;

        // Фільтр по сторінці
        if (pageValue !== "all" && rowPage !== pageValue) visible = false;

        // Фільтр по даті
        if (dateFrom) visible = visible && (rowTime >= new Date(dateFrom));
        if (dateTo) visible = visible && (rowTime <= new Date(dateTo + "T23:59:59"));

        row.style.display = visible ? "" : "none";
      }
    }

    function resetFilters() {
      document.getElementById("pageFilter").value = "all";
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      applyFilters();
    }
  </script>
</body>
</html>
