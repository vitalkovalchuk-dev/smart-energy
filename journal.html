<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Електронний журнал</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; cursor: pointer; }
    pre { margin: 0; font-family: monospace; white-space: pre-wrap; }
    .filters { margin-bottom: 10px; }
    .btn-back { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Електронний журнал</h1>

  <div class="filters">
    <label>Сторінка:
      <select id="pageFilter">
        <option value="all">Всі</option>
        <option value="PO.json">Технічний огляд</option>
        <option value="TO.json">Технічне обслуговування</option>
        <option value="PR.json">Плановий ремонт</option>
        <option value="ADJ.json">Регулювання</option>
        <option value="VK.json">Відомчий контроль</option>
      </select>
    </label>

    <label>Дата від:
      <input type="date" id="dateFrom">
    </label>
    <label>до:
      <input type="date" id="dateTo">
    </label>
    <button onclick="applyFilters()">Фільтрувати</button>
    <button onclick="resetFilters()">Скинути</button>
  </div>

  <table id="logTable">
    <thead>
      <tr>
        <th>Час</th>
        <th>Сторінка</th>
        <th>Дані</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>

  <button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

  <script>
    const logBody = document.getElementById("logBody");
    let journalData = [];

    async function loadJournal() {
      try {
        const res = await fetch("/data/journal.json?_=" + Date.now()); // уникаємо кешу
        if (!res.ok) throw new Error("Не вдалося завантажити journal.json");
        journalData = await res.json();
        renderTable(journalData);
      } catch (err) {
        console.error(err);
        logBody.innerHTML = `<tr><td colspan="3">⚠️ Не вдалося завантажити журнал</td></tr>`;
      }
    }

    function renderTable(data) {
      logBody.innerHTML = "";
      if (data.length === 0) {
        logBody.innerHTML = `<tr><td colspan="3">Журнал порожній</td></tr>`;
        return;
      }

      for (const row of data) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${new Date(row.time).toLocaleString("uk-UA")}</td>
          <td>${row.source}</td>
          <td><pre>${row.summary}</pre></td>
        `;
        logBody.appendChild(tr);
      }
    }

    function applyFilters() {
      const pageValue = document.getElementById("pageFilter").value;
      const dateFrom = document.getElementById("dateFrom").value;
      const dateTo = document.getElementById("dateTo").value;

      const filtered = journalData.filter(row => {
        const rowTime = new Date(row.time);
        let visible = true;

        if (pageValue !== "all" && row.source !== pageValue) visible = false;
        if (dateFrom && rowTime < new Date(dateFrom)) visible = false;
        if (dateTo && rowTime > new Date(dateTo + "T23:59:59")) visible = false;

        return visible;
      });

      renderTable(filtered);
    }

    function resetFilters() {
      document.getElementById("pageFilter").value = "all";
      document.getElementById("dateFrom").value = "";
      document.getElementById("dateTo").value = "";
      renderTable(journalData);
    }

    loadJournal();
  </script>
</body>
</html>
