<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фотофіксація</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("header.html")
        .then(response => response.text())
        .then(data => {
          document.body.insertAdjacentHTML("afterbegin", data);
        });
    });
  </script>
</head>
<body>
    
  <main>
    <h1>Фотофіксація стану об’єкта</h1>
    <form id="photoForm" enctype="multipart/form-data">
      <label for="photoUpload">Завантажте фото:</label><br>
      <input type="file" id="photoUpload" name="photoUpload" accept="image/*"><br><br>
      <button type="submit">Зберегти фото</button>
    </form>
    <div id="photoGallery">
      <p>Тут буде відображатися галерея завантажених фото.</p>
    </div>
  </main>

    <h2>Фото ПРГ (станом на 20.03.2023) </h2>

    <div class="gallery">
      <button class="prev" onclick="prevImage()">❮</button>
      <button class="next" onclick="nextImage()">❯</button>
      <img src="img/Foto/ШРП №61_new_1.jpg" alt="Фото 1">
      <img src="img/Foto/ШРП №61_new_2.jpg" alt="Фото 2">
      <img src="img/Foto/ШРП №61_new_3.jpg" alt="Фото 3">
      <img src="img/Foto/ШРП №61_new_4.jpg" alt="Фото 4">
      <img src="img/Foto/ШРП №61_new_5.jpg" alt="Фото 5">
    </div>
  
  <h2>Фото ПРГ (станом на 05.02.2023) </h2>

    <div class="gallery">
      <button class="prev" onclick="prevImage()">❮</button>
      <button class="next" onclick="nextImage()">❯</button>
      <img src="img/Foto/ШРП №61_old_1.jpg" alt="Фото 1">
      <img src="img/Foto/ШРП №61_old_2.jpg" alt="Фото 2">
      <img src="img/Foto/ШРП №61_old_3.jpg" alt="Фото 3">
      <img src="img/Foto/ШРП №61_old_4.jpg" alt="Фото 4">
    </div>
  

<button class="btn-back" onclick="window.history.back()">⬅ Повернутись</button>

    
  <script>
    function goBackOneLevel() {
      let path = window.location.pathname.split("/");
      if (path.length > 2) {
        path.pop(); // прибираємо поточний файл
        window.location.href = path.join("/") + "/";
      } else {
        // якщо ми вже в корені сайту
        window.location.href = "/";
      }
    }
    </script>

</body>
</html>
